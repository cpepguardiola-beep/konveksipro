<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>KonveksiPro</title>
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --brand:#4f46e5; --brand-2:#4338ca; --ok:#059669; --bad:#e11d48; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:8px 14px; }
  .primary { background:var(--brand); color:#fff; }
  .primary:hover { background:var(--brand-2); }
  .ghost { background:#f1f5f9; color:var(--ink); }
  .danger { background:var(--bad); color:#fff; }
  .small { padding:5px 10px; font-size:12px; }
  input, select, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; }
  input[type=checkbox] { width:auto; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px; }
  label.inline { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); font-weight:500; margin:6px 0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:800px){ .grid2,.grid4 { grid-template-columns:1fr 1fr; } }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px; border-bottom:1px solid var(--line); background:#f8fafc; }
  td { padding:9px 8px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.total td { font-weight:800; border-top:2px solid var(--ink); }
  tr.deleted td { opacity:.55; text-decoration:line-through; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .grow { flex:1; min-width:160px; }
  .toolbar input.narrow { max-width:220px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .tab.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#e2e8f0; }
  .badge.ok { background:#d1fae5; color:#065f46; }
  .badge.off { background:#fee2e2; color:#991b1b; }
  .badge.warn { background:#fef3c7; color:#92400e; }
  .muted { color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .stat { font-size:24px; font-weight:800; }
  .stat-label { font-size:12px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:24px; }
  .section-title { font-weight:700; margin:0 0 10px; }
  .list-item { padding:7px 0; border-bottom:1px solid #f1f5f9; }
  .note { background:#f1f5f9; border-radius:10px; padding:10px 12px; font-size:12px; color:var(--muted); margin-top:12px; }
  .ok-box { background:#d1fae5; color:#065f46; padding:10px 12px; border-radius:10px; font-weight:600; }
  .bad-box { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:10px; font-weight:600; }
  /* login */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:linear-gradient(135deg,#0f172a,#312e81); }
  #login .box { background:#fff; border-radius:18px; width:100%; max-width:380px; overflow:hidden; }
  #login .head { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; padding:22px; text-align:center; }
  #login .head h1 { margin:0; font-size:20px; }
  #login form { padding:20px; }
  /* layout */
  #app { display:flex; min-height:100vh; }
  #side { width:230px; background:#0f172a; color:#cbd5e1; padding:14px; flex-shrink:0; display:flex; flex-direction:column; }
  #side .brand { color:#fff; font-weight:800; font-size:16px; padding:6px 8px 12px; }
  #brandSel { background:#1e293b; color:#fff; border-color:#334155; margin-bottom:12px; }
  #side a { display:block; color:#cbd5e1; text-decoration:none; padding:8px 10px; border-radius:8px; font-size:13px; margin-bottom:2px; }
  #side a:hover { background:#1e293b; color:#fff; }
  #side a.on { background:var(--brand); color:#fff; }
  #side .me { margin-top:auto; font-size:12px; padding:10px 8px; border-top:1px solid #1e293b; }
  #main { flex:1; padding:22px; min-width:0; }
  #main h2 { margin:0 0 4px; font-size:20px; }
  #main .sub { color:var(--muted); margin-bottom:16px; font-size:13px; }
  .overflow { overflow-x:auto; }
  #offline { background:#fef3c7; color:#92400e; padding:8px 14px; font-size:13px; text-align:center; display:none; }
  #offline.show { display:block; }
  /* modal & toast */
  #modal { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 12px; overflow-y:auto; z-index:50; }
  #modal .panel { background:#fff; border-radius:16px; width:100%; max-width:600px; padding:18px; }
  #modal .panel.wide { max-width:820px; }
  #modal .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #modal .panel-head h3 { margin:0; font-size:16px; }
  #modal .x { background:none; color:var(--muted); font-size:18px; padding:2px 8px; }
  #toasts { position:fixed; bottom:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:60; }
  .toast { background:#0f172a; color:#fff; padding:10px 14px; border-radius:10px; max-width:340px; font-size:13px; }
  .toast.err { background:var(--bad); }
  /* struk / invoice gaya receipt */
  .receipt { width:340px; max-width:100%; margin:0 auto; background:#f7f7f7; padding:18px 16px; font-family: "Helvetica Neue", Arial, sans-serif; color:#222; font-size:13px; }
  .receipt .c { text-align:center; }
  .receipt .big { font-size:17px; font-weight:700; }
  .receipt .small { font-size:11px; color:#555; }
  .receipt .dash { border-top:1px dashed #888; margin:10px 0; }
  .receipt .row { display:flex; justify-content:space-between; gap:8px; margin:2px 0; }
  .receipt .iname { margin-top:8px; font-weight:600; }
  .receipt .total { font-size:17px; font-weight:700; }
  .receipt .thanks { font-size:15px; margin-top:12px; text-align:center; }
  .receipt svg { display:block; margin:12px auto 4px; }
  /* cetak: hanya struk/invoice yang tercetak */
  @media print {
    @page { margin:6mm; }
    body * { visibility:hidden; }
    #modal, #modal * { visibility:visible; }
    #modal { position:absolute; left:0; top:0; padding:0; background:#fff; display:block; }
    #modal .panel { box-shadow:none; padding:0; max-width:none; }
    #modal .noprint, #modal-x, .noprint { display:none !important; }
    #side, #toasts, #offline, .toolbar, .tabs { display:none !important; }
    #app { display:block; }
    #main { padding:0; }
    body { background:#fff; }
    .card { border:0; padding:0; }
  }
  @media (max-width:800px){ #app { flex-direction:column; } #side { width:100%; } }
</style>
</head>
<body>

<div id="offline">Mode offline: menampilkan data terakhir yang tersimpan. Perubahan belum bisa disimpan sampai internet tersambung.</div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="box">
    <div class="head"><h1>KonveksiPro</h1><div style="font-size:12px;opacity:.85">Stok, produksi & keuangan konveksi</div></div>
    <form id="login-form">
      <label>Username</label>
      <input id="li-user" autocomplete="username" required />
      <label>Password</label>
      <input id="li-pass" type="password" autocomplete="current-password" required />
      <div id="login-err" class="hidden" style="color:var(--bad);font-size:13px;margin-top:10px"></div>
      <div class="actions" style="justify-content:stretch"><button class="primary" style="width:100%;padding:11px">Masuk</button></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand">KonveksiPro</div>
    <select id="brandSel" title="Pilih brand"></select>
    <nav id="nav"></nav>
    <div class="me">
      <div id="me-name"></div>
      <div class="muted" id="me-role"></div>
      <button class="ghost small" id="logout" style="margin-top:8px;width:100%">Keluar</button>
    </div>
  </aside>
  <main id="main">
    <h2 id="page-title"></h2>
    <div class="sub" id="page-sub"></div>
    <div id="page"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="panel" id="modal-panel">
    <div class="panel-head"><h3 id="modal-title"></h3><button class="x" id="modal-x">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';

// ============================================================================
// MENU & SKEMA DATA
// ============================================================================
const MENUS = [
  { id: 'dashboard', label: 'Dashboard', sub: 'Ringkasan, laba bulan ini, margin, stok mati & pengingat' },
  { id: 'inventory', label: 'Stok Barang Jadi', sub: 'Stok per model, warna & ukuran, dengan barcode', cols: ['inventory'] },
  { id: 'marketplace', label: 'Shopee, TikTok & Lainnya', sub: 'Penjualan per channel dan pesanan grosir', cols: ['marketplace_sales', 'wholesale_orders'] },
  { id: 'live_content', label: 'Live & Konten', sub: 'Laporan host live dan tim konten', cols: ['live_reports', 'content_reports'] },
  { id: 'hpp', label: 'Perkiraan HPP', sub: 'Daftar model produk, HPP otomatis, dan harga tayang' },
  { id: 'fabrics', label: 'Stok Kain', sub: 'Persediaan kain mentah (meter)', cols: ['fabrics'] },
  { id: 'cutting', label: 'Baru Dipotong', sub: 'Hasil cutting siap diambil penjahit', cols: ['cutting'] },
  { id: 'tailors', label: 'Tukang Jahit & Invoice', sub: 'Penjahit, invoice jahit & penjualan, dan QC', cols: ['tailors'] },
  { id: 'supplies', label: 'Pembelian Alat', sub: 'Benang, kancing, resleting, packing', cols: ['supplies'] },
  { id: 'finance', label: 'Keuangan', sub: 'Buku kas, laba rugi, neraca, dan daftar aset' },
  { id: 'payroll', label: 'Gaji & Kasbon', sub: 'Karyawan, riwayat gaji, dan kasbon', cols: ['employees', 'payroll_history', 'kasbon'] },
  { id: 'tasks', label: 'Kerja Harian', sub: 'Tugas tim dan progresnya', cols: ['tasks'] },
  { id: 'brands', label: 'Brand & Channel', sub: 'Daftar brand usaha', cols: ['brands'], ownerOnly: true },
  { id: 'audit', label: 'Riwayat & Audit', sub: 'Jejak semua perubahan data' },
  { id: 'accounts', label: 'Sub Akun', sub: 'Kelola akun dan hak akses menu', ownerOnly: true },
  { id: 'settings', label: 'Pengaturan & Backup', sub: 'Profil usaha, biaya standar, password, backup' }
];
const TAB_VIEWS = {
  tailors: [{ id: 'tailors', label: 'Penjahit' }, { id: 'invoices', label: 'Invoice' }, { id: 'qc_rejects', label: 'QC & Cacat' }],
  finance: [{ id: 'cashbook', label: 'Buku Kas' }, { id: 'labarugi', label: 'Laba Rugi' }, { id: 'neraca', label: 'Neraca' }, { id: 'aset', label: 'Daftar Aset' }],
  hpp: []
};
const PERM_MENUS = [
  { id: 'inventory', label: 'Stok Barang Jadi' }, { id: 'marketplace', label: 'Shopee, TikTok & Lainnya' },
  { id: 'live_content', label: 'Live & Konten' }, { id: 'hpp', label: 'Perkiraan HPP' }, { id: 'fabrics', label: 'Stok Kain' },
  { id: 'cutting', label: 'Baru Dipotong' }, { id: 'tailors', label: 'Tukang Jahit & Invoice' }, { id: 'supplies', label: 'Pembelian Alat' },
  { id: 'finance', label: 'Keuangan (kas, laba rugi, neraca, aset)' }, { id: 'payroll', label: 'Gaji & Kasbon' }, { id: 'tasks', label: 'Kerja Harian' }
];

const BIAYA_KEYS = ['kacing', 'keras', 'setrika', 'packing', 'jahit', 'benang', 'potong', 'iklan'];
const BIAYA_LABEL = { kacing: 'Kacing / sleting', keras: 'Potong kain keras', setrika: 'Setrika', packing: 'Packing / label / plastik', jahit: 'Jahit (per pcs)', benang: 'Buang benang', potong: 'Potong (per pcs)', iklan: 'Iklan sebelum Shopee (per model)' };

const f = {
  t: (k, l, req) => ({ k, l, type: 'text', req }),
  n: (k, l) => ({ k, l, type: 'number' }),
  m: (k, l) => ({ k, l, type: 'number', money: true }),
  d: (k, l) => ({ k, l, type: 'date' }),
  s: (k, l, opts) => ({ k, l, type: 'select', opts }),
  x: (k, l) => ({ k, l, type: 'textarea' }),
  c: (k, l) => ({ k, l, type: 'checkbox' }),
  b: (k, l) => ({ k, l, type: 'brand' }),
  fb: (k, l) => ({ k, l, type: 'fabric' })
};
const SUPPLY_CATS = ['Benang', 'Kain Keras', 'Kancing', 'Resleting', 'Label & Hangtag', 'Plastik Packing'];
const WALLETS = ['Kas Tunai', 'Rekening Bank', 'Saldo Shopee', 'Saldo TikTok', 'Saldo Tokopedia', 'Saldo Lazada'];
const CHANNELS = ['Shopee', 'TikTok Shop', 'Tokopedia', 'Lazada', 'Instagram', 'WhatsApp', 'Lainnya'];
const ASSET_KAT = ['Mesin Jahit', 'Mesin Obras', 'Mesin Setrika', 'Kendaraan', 'Peralatan', 'Bangunan', 'Komputer / HP', 'Lainnya'];

const S = {
  inventory: { label: 'Stok Barang Jadi', cols: ['model', 'color', 'size', 'stock', 'price', 'barcode'], fields: [f.t('model', 'Model', 1), f.t('color', 'Warna'), f.t('size', 'Ukuran (mis. No. 6)'), f.n('stock', 'Stok (pcs)'), f.m('hpp', 'HPP per pcs (modal)'), f.m('price', 'Harga jual'), f.t('barcode', 'Barcode / kode SKU')] },
  fabrics: { label: 'Stok Kain', cols: ['name', 'color', 'meters', 'pricePerMeter', 'supplier'], fields: [f.t('name', 'Nama kain', 1), f.t('color', 'Warna'), f.n('meters', 'Meter'), f.m('pricePerMeter', 'Harga per meter'), f.t('supplier', 'Supplier')] },
  cutting: { label: 'Baru Dipotong', cols: ['date', 'model', 'color', 'size', 'qty', 'cutter'], fields: [f.d('date', 'Tanggal'), f.t('model', 'Model', 1), f.t('color', 'Warna'), f.t('size', 'Ukuran'), f.n('qty', 'Jumlah potong'), f.t('fabricUsed', 'Kain yang dipakai'), f.t('cutter', 'Pemotong')] },
  tailors: { label: 'Penjahit', cols: ['name', 'phone', 'specialty'], fields: [f.t('name', 'Nama penjahit', 1), f.t('phone', 'No. HP'), f.t('specialty', 'Keahlian')] },
  invoices: { label: 'Invoice', cols: ['no', 'date', 'total', 'status'], fields: [f.d('date', 'Tanggal'), f.t('tailor', 'Nama'), f.m('total', 'Total'), f.x('note', 'Catatan')] },
  qc_rejects: { label: 'QC & Cacat', cols: ['date', 'model', 'color', 'size', 'qty', 'reason'], fields: [f.d('date', 'Tanggal'), f.t('model', 'Model', 1), f.t('color', 'Warna'), f.t('size', 'Ukuran'), f.n('qty', 'Jumlah'), f.t('reason', 'Alasan / jenis cacat')] },
  supplies: { label: 'Pembelian Alat', cols: ['date', 'category', 'item', 'qty', 'cost'], fields: [f.d('date', 'Tanggal'), f.s('category', 'Kategori', SUPPLY_CATS), f.t('item', 'Nama barang', 1), f.n('qty', 'Jumlah'), f.m('cost', 'Total biaya')] },
  marketplace_sales: { label: 'Penjualan', cols: ['date', 'channel', 'orderNo', 'model', 'qty', 'price'], fields: [f.d('date', 'Tanggal'), f.s('channel', 'Channel', CHANNELS), f.t('orderNo', 'No. pesanan'), f.t('model', 'Model'), f.t('color', 'Warna'), f.t('size', 'Ukuran'), f.n('qty', 'Jumlah'), f.m('price', 'Harga satuan')] },
  wholesale_orders: { label: 'Pesanan Grosir', cols: ['date', 'customer', 'total', 'status'], fields: [f.d('date', 'Tanggal'), f.t('customer', 'Nama pelanggan', 1), f.m('total', 'Total'), f.s('status', 'Status', ['Baru', 'Dikirim', 'Lunas']), f.x('note', 'Catatan')] },
  live_reports: { label: 'Laporan Live', cols: ['date', 'host', 'hours', 'sales'], fields: [f.d('date', 'Tanggal'), f.t('host', 'Nama host', 1), f.n('hours', 'Durasi (jam)'), f.m('sales', 'Omzet'), f.x('note', 'Catatan')] },
  content_reports: { label: 'Laporan Konten', cols: ['date', 'person', 'task', 'output'], fields: [f.d('date', 'Tanggal'), f.t('person', 'Nama', 1), f.t('task', 'Tugas'), f.t('output', 'Hasil'), f.x('note', 'Catatan')] },
  employees: { label: 'Karyawan', cols: ['name', 'position', 'baseSalary', 'allowance'], fields: [f.t('name', 'Nama', 1), f.t('position', 'Jabatan'), f.m('baseSalary', 'Gaji pokok'), f.m('allowance', 'Tunjangan')] },
  payroll_history: { label: 'Riwayat Gaji', cols: ['date', 'period', 'empName', 'netPay'], fields: [f.d('date', 'Tanggal'), f.t('period', 'Periode (mis. 2026-11)'), f.t('empName', 'Nama karyawan', 1), f.m('baseSalary', 'Gaji pokok'), f.m('allowance', 'Tunjangan'), f.m('bonus', 'Bonus'), f.m('deduction', 'Potongan'), f.m('netPay', 'Diterima')] },
  kasbon: { label: 'Buku Kasbon', cols: ['date', 'personName', 'roleType', 'amount', 'status'], fields: [f.d('date', 'Tanggal'), f.t('personName', 'Nama', 1), f.s('roleType', 'Peran', ['Karyawan', 'Penjahit']), f.m('amount', 'Nominal'), f.t('note', 'Keterangan'), f.s('status', 'Status', ['Aktif', 'Lunas'])] },
  cashbook: { label: 'Buku Kas', cols: ['date', 'type', 'wallet', 'category', 'desc', 'amount'], fields: [f.d('date', 'Tanggal'), f.s('type', 'Jenis', ['IN', 'OUT']), f.s('wallet', 'Dompet', WALLETS), f.t('category', 'Kategori (mis. Operasional, Listrik)'), f.t('desc', 'Keterangan'), f.m('amount', 'Nominal')] },
  tasks: { label: 'Tugas Harian', cols: ['title', 'assignee', 'category', 'priority', 'done'], fields: [f.d('date', 'Tanggal'), f.t('title', 'Judul tugas', 1), f.t('assignee', 'Penanggung jawab'), f.t('category', 'Kategori'), f.s('priority', 'Prioritas', ['Tinggi', 'Sedang', 'Rendah']), f.c('done', 'Sudah selesai')] },
  brands: { label: 'Brand & Channel', cols: ['name', 'code', 'note'], fields: [f.t('name', 'Nama brand', 1), f.t('code', 'Kode singkat (mis. ELB)'), f.x('note', 'Keterangan')] },
  product_models: { label: 'Model Produk', cols: ['jenis', 'nomor', 'namaModel', 'fabricId', 'kainMeter', 'hargaTayang'], fields: [f.s('jenis', 'Jenis', ['Kurta', 'Gamis', 'Lainnya']), f.t('nomor', 'Nomor / ukuran', 1), f.t('namaModel', 'Nama model (opsional)'), f.fb('fabricId', 'Kain dari Stok Kain'), f.n('kainMeter', 'Pemakaian kain (meter)'), f.m('kainHarga', 'Harga kain/m (jika tidak pakai Stok Kain)'), f.m('hargaTayang', 'Harga tayang (jual)'), f.x('catatan', 'Catatan')] },
  assets: { label: 'Daftar Aset', cols: ['nama', 'kategori', 'tanggal', 'harga', 'umurBulan'], fields: [f.t('nama', 'Nama aset', 1), f.s('kategori', 'Kategori', ASSET_KAT), f.d('tanggal', 'Tanggal perolehan'), f.m('harga', 'Harga perolehan'), f.m('nilaiSisa', 'Nilai sisa'), f.n('umurBulan', 'Umur ekonomis (bulan)'), f.x('catatan', 'Catatan')] }
};

// Data yang dikaitkan dengan brand (kecuali data yang berlaku untuk semua brand)
const BRAND_FREE = ['brands', 'employees', 'tasks', 'kasbon', 'payroll_history'];
Object.keys(S).forEach((c) => {
  if (BRAND_FREE.includes(c)) return;
  S[c].fields.unshift(f.b('brandId', 'Brand'));
  S[c].cols = [...S[c].cols, 'brandId'];
});

const COLL_MENU = {
  inventory: 'inventory', fabrics: 'fabrics', cutting: 'cutting', tailors: 'tailors', invoices: 'tailors',
  qc_rejects: 'tailors', supplies: 'supplies', employees: 'payroll', payroll_history: 'payroll', kasbon: 'payroll',
  cashbook: 'finance', assets: 'finance', marketplace_sales: 'marketplace', wholesale_orders: 'marketplace',
  live_reports: 'live_content', content_reports: 'live_content', tasks: 'tasks', brands: 'brands', product_models: 'hpp'
};

// ============================================================================
// HELPER
// ============================================================================
let ME = null;
let OFFLINE = false;
let BRANDS = [];
let FABRICS = [];
let currentBrand = localStorage.getItem('kp_brand') || 'all';
let ownerShowDeleted = false;
let currentTab = {};
let lastRows = [];
let currentRows = [];
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp ' + Math.round(Number(n || 0)).toLocaleString('id-ID');
const num = (n) => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const isOwner = () => !!ME && ME.role === 'owner';
const canMenu = (id) => {
  if (!ME) return false;
  const m = MENUS.find((x) => x.id === id);
  if (m && m.ownerOnly) return isOwner();
  if (id === 'dashboard' || id === 'settings') return true;
  if (isOwner()) return true;
  return ME.permissions.includes(id);
};
const brandMatch = (bid) => currentBrand === 'all' || !bid || bid === currentBrand;
const brandName = (id) => {
  if (!id) return '—';
  const b = BRANDS.find((x) => x.id === id);
  return b ? b.name : '(brand dihapus)';
};
const today = () => new Date().toISOString().slice(0, 10);
const monthStart = () => today().slice(0, 8) + '01';
const daysAgo = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
const ageDays = (d) => (d ? Math.floor((Date.now() - new Date(d).getTime()) / 864e5) : 0);
const skuKey = (d) => [d.model, d.color, d.size].map((x) => String(x || '').trim().toLowerCase()).join('|');
const brandQS = () => (currentBrand !== 'all' ? '&brandId=' + encodeURIComponent(currentBrand) : '');
const pill = (text, cls) => `<span class="badge ${cls || ''}">${esc(text)}</span>`;

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

async function api(method, path, body, silent) {
  const opts = { method, headers: {}, credentials: 'same-origin' };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opts); }
  catch (_) { const e = new Error('Tidak ada koneksi internet.'); e.offline = true; throw e; }
  let json = null;
  try { json = await r.json(); } catch (_) {}
  if (r.status === 401 && !silent) { showLogin('Sesi habis. Silakan login lagi.'); throw new Error('Sesi habis.'); }
  if (!r.ok) { const e = new Error((json && json.error) || 'Terjadi kesalahan.'); e.status = r.status; e.data = json; throw e; }
  return json;
}

function openModal(title, html, wide) {
  $('#modal-title').textContent = title;
  $('#modal-panel').classList.toggle('wide', !!wide);
  $('#modal-body').innerHTML = html;
  $('#modal').classList.remove('hidden');
  return $('#modal-body');
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modal-body').innerHTML = ''; }
$('#modal-x').onclick = closeModal;
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function showLogin(msg) {
  ME = null;
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const err = $('#login-err');
  if (msg) { err.textContent = msg; err.classList.remove('hidden'); } else err.classList.add('hidden');
}

function refreshOfflineBanner() { $('#offline').classList.toggle('show', OFFLINE || !navigator.onLine); }

async function startApp() {

window.addEventListener('hashchange', route);

async function route() {
  if (!ME) return;
  let id = (location.hash || '#dashboard').slice(1).split('/')[0];
  let menu = MENUS.find((m) => m.id === id);
  if (!menu || !canMenu(id)) { menu = MENUS[0]; id = 'dashboard'; }
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.id === id));
  $('#page-title').textContent = menu.label;
  $('#page-sub').textContent = menu.sub || '';
  $('#page').innerHTML = '<div class="empty">Memuat...</div>';
  try {
    await loadBrands();
    if (id === 'dashboard') return await renderDashboard();
    if (id === 'audit') return await renderAudit();
    if (id === 'accounts') return await renderAccounts();
    if (id === 'settings') return await renderSettings();
    if (id === 'hpp') return await renderHpp();

    // menu dengan beberapa tab (Penjahit/Invoice/QC, Keuangan) atau satu koleksi
    const views = TAB_VIEWS[id] || (menu.cols || []).map((c) => ({ id: c, label: S[c].label }));
    let sel = currentTab[id];
    if (!views.some((v) => v.id === sel)) sel = views[0] && views[0].id;
    currentTab[id] = sel;
    $('#page').innerHTML = (views.length > 1 ? `<div class="tabs">${views.map((v) => `<button class="tab ${v.id === sel ? 'on' : ''}" data-tab="${v.id}">${esc(v.label)}</button>`).join('')}</div>` : '')
      + '<div id="view"><div class="empty">Memuat...</div></div>';
    document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { currentTab[id] = b.dataset.tab; route(); });

    if (sel === 'invoices') await renderInvoices();
    else if (sel === 'labarugi') await renderLabaRugi();
    else if (sel === 'neraca') await renderNeraca();
    else if (sel === 'aset') await renderAset();
    else await renderCollection(sel);
  } catch (e) {
    $('#page').innerHTML = `<div class="card" style="color:var(--bad)">${esc(e.message)}</div>`;
  }
}

async function renderDashboard() {

  const colls = Object.keys(COLL_MENU).filter((c) => canMenu(COLL_MENU[c]));

  }

  const cards = [];
  if (labaBulan) cards.push([rp(labaBulan.labaBersih), 'Laba bersih bulan ini']);
  if (canMenu('inventory')) cards.push([inv.length, 'Jenis stok barang jadi']);
  if (canMenu('marketplace')) cards.push([dead.length, 'Stok mati (60 hari)']);
  if (canMenu('payroll')) cards.push([kasbonOpen.length, 'Kasbon belum lunas']);
  cards.push([rem.length, 'Pengingat aktif']);

  $('#page').innerHTML = `
    <div class="grid4" style="margin-bottom:14px">
      ${cards.map(([v, l]) => `<div class="card"><div class="stat">${esc(v)}</div><div class="stat-label">${esc(l)}</div></div>`).join('')}
    </div>

      <div class="card"><div class="section-title">Pengingat</div>
        ${rem.length ? rem.slice(0, 12).map((t) => `<div class="list-item">${esc(t)}</div>`).join('') : '<div class="empty">Tidak ada pengingat. Semua aman.</div>'}</div>
      <div class="card"><div class="section-title">Penjualan per channel (30 hari)</div>
        ${Object.keys(byCh).length ? `<table><tr><th>Channel</th><th class="num">Terjual</th><th class="num">Omzet</th></tr>

async function renderCollection(coll) {
  const sc = S[coll];
  $('#view').innerHTML = `
    <div class="toolbar">
      <input class="grow" id="q" placeholder="Cari..." />
      ${coll === 'inventory' ? `<input class="narrow" id="scanIn" placeholder="Scan barcode lalu Enter" /><button class="ghost" id="cam">Kamera</button>` : ''}
      ${isOwner() ? `<label class="inline" style="margin:0"><input type="checkbox" id="showDel" ${ownerShowDeleted ? 'checked' : ''}/> Tampilkan yang terhapus</label>` : ''}
      <button class="ghost noprint" id="csv">Ekspor CSV (Excel)</button>
      <button class="ghost noprint" id="pdf">Cetak / PDF</button>
      <button class="primary noprint" id="add">+ Tambah</button>
    </div>
    <div class="card overflow" id="tbl"><div class="empty">Memuat data...</div></div>`;
  if ($('#showDel')) $('#showDel').onchange = (e) => { ownerShowDeleted = e.target.checked; loadTable(coll, sc); };
  $('#add').onclick = () => openForm(coll, sc, null);
  $('#q').oninput = () => filterRows();
  $('#csv').onclick = () => exportCsv(coll, sc);
  $('#pdf').onclick = () => window.print();
  if ($('#scanIn')) {
    $('#scanIn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); e.target.value = ''; handleScan(v); }
    });
    $('#cam').onclick = scanCamera;
  }
  await loadTable(coll, sc);
}

async function loadTable(coll, sc) {
  const q = ownerShowDeleted && isOwner() ? '?deleted=1' : '';
  const { items } = await api('GET', `/api/c/${coll}${q}`);
  currentRows = items;
  currentRows.__coll = coll;
  currentRows.__sc = sc;
  filterRows();
}

function cellValue(field, v) {
  if (field.type === 'brand') return esc(brandName(v));
  if (field.type === 'fabric') { const x = FABRICS.find((y) => y.id === v); return esc(x ? x.data.name : (v ? '(kain dihapus)' : '—')); }
  if (field.type === 'checkbox') return v ? '✓' : '–';
  if (field.money) return rp(v);
  if (field.k === 'status' || field.k === 'priority') return pill(v);
  return esc(v);
}

function filterRows() {
  const box = $('#tbl');
  if (!box) return;
  const q = ($('#q') ? $('#q').value : '').toLowerCase().trim();
  const sc = currentRows.__sc;
  const coll = currentRows.__coll;
  const rows = currentRows.filter((it) => brandMatch(it.data.brandId) && (!q || Object.values(it.data).join(' ').toLowerCase().includes(q)));
  lastRows = rows;
  lastRows.__sc = sc;
  if (!rows.length) { box.innerHTML = '<div class="empty">Belum ada data.</div>'; return; }
  const fieldByKey = Object.fromEntries(sc.fields.map((x) => [x.k, x]));
  box.innerHTML = `<table>
    <tr>${sc.cols.map((c) => `<th>${esc(fieldByKey[c] ? fieldByKey[c].l : c)}</th>`).join('')}<th class="noprint" style="text-align:right">Aksi</th></tr>
    ${rows.map((it) => {
      const del = !!it.deletedAt;
      const cells = sc.cols.map((c) => `<td>${cellValue(fieldByKey[c] || { type: 'text' }, it.data[c])}</td>`).join('');
      const actions = del
        ? (isOwner() ? `<button class="ghost small" data-restore="${esc(it.id)}">Pulihkan</button>` : '<span class="muted">terhapus</span>')
        : `<button class="ghost small" data-edit="${esc(it.id)}">Edit</button> <button class="danger small" data-del="${esc(it.id)}">Hapus</button>`;
      return `<tr class="${del ? 'deleted' : ''}">${cells}<td class="noprint" style="text-align:right;white-space:nowrap">${actions}</td></tr>`;
    }).join('')}
  </table>`;
  box.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => openForm(coll, sc, rows.find((r) => r.id === b.dataset.edit)));
  box.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => confirmDelete(coll, rows.find((r) => r.id === b.dataset.del)));
  box.querySelectorAll('[data-restore]').forEach((b) => b.onclick = () => restoreRow(coll, b.dataset.restore));
}

function csvCell(fl, v) {
  if (fl.type === 'brand') v = brandName(v);
  else if (fl.type === 'fabric') { const x = FABRICS.find((y) => y.id === v); v = x ? x.data.name : ''; }
  else if (fl.type === 'checkbox') v = v ? 'Ya' : 'Tidak';
  if (typeof v === 'number') return String(v);
  return '"' + String(v ?? '').replace(/"/g, '""') + '"';
}
function exportCsv(coll, sc) {
  const rows = lastRows;
  const head = sc.fields.map((x) => `"${x.l}"`).join(';');
  const lines = rows.map((r) => sc.fields.map((fl) => csvCell(fl, r.data[fl.k])).join(';'));
  download(new Blob(['\ufeff' + [head, ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `${coll}_${today()}.csv`);
  toast(`Ekspor ${rows.length} baris.`);
}

async function handleScan(code) {
  if (!code) return;
  try {
    const { items } = await api('GET', '/api/c/inventory');
    const hit = items.find((i) => i.data.barcode === code);
    if (hit) { openForm('inventory', S.inventory, hit); toast('Produk ditemukan: ' + (hit.data.model || '')); }
    else { openForm('inventory', S.inventory, null, { barcode: code }); toast('Barcode baru. Lengkapi data produknya.'); }
  } catch (err) { toast(err.message, 'err'); }
}

async function scanCamera() {
  if (!('BarcodeDetector' in window)) {
    toast('Kamera scan tidak didukung browser ini (coba Chrome di Android). Pakai scanner USB atau ketik barcode.', 'err');
    return;
  }
  const body = openModal('Scan dengan kamera', `
    <video id="vid" playsinline muted style="width:100%;border-radius:10px;background:#000"></video>
    <div class="muted" style="margin-top:8px">Arahkan kamera ke barcode produk.</div>
    <div class="actions"><button class="ghost" id="stopCam">Tutup</button></div>`);
  let stream = null;
  const stopTracks = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; };
  body.querySelector('#stopCam').onclick = () => { stopTracks(); closeModal(); };
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (e) { toast('Kamera tidak bisa dibuka: ' + e.message, 'err'); closeModal(); return; }
  const vid = body.querySelector('#vid');
  vid.srcObject = stream;
  await vid.play();
  const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'code_128', 'qr_code'] });
  const loop = async () => {
    if ($('#modal').classList.contains('hidden') || !stream) { stopTracks(); return; }
    try {
      const codes = await det.detect(vid);
      if (codes.length) { const code = codes[0].rawValue; stopTracks(); closeModal(); handleScan(code); return; }
    } catch (_) {}
    setTimeout(loop, 400);
  };
  loop();
}

// Form umum untuk koleksi (termasuk override biaya untuk Model Produk)
async function openForm(coll, sc, item, prefill) {
  if (sc.fields.some((x) => x.type === 'fabric')) await loadFabrics();
  const d = item ? item.data : { date: today(), brandId: currentBrand !== 'all' ? currentBrand : '', ...(prefill || {}) };
  let extra = '';
  if (coll === 'product_models') {
    const std = (await api('GET', '/api/settings')).settings.biayaStandar;
    const ov = (item && isPlainObject(d.biaya)) ? d.biaya : {};
    extra = `<div class="section-title" style="margin-top:14px">Biaya lain per model</div>
      <div class="muted" style="margin-bottom:6px">Kosongkan jika ingin memakai biaya standar (Pengaturan). Isi hanya jika model ini berbeda.</div>
      <div class="grid2">${BIAYA_KEYS.map((k) => `<div><label>${esc(BIAYA_LABEL[k])} (standar ${rp(std[k])})</label>
        <input type="number" step="any" name="bio_${k}" value="${ov[k] !== undefined && ov[k] !== null ? esc(ov[k]) : ''}" placeholder="${std[k]}"/></div>`).join('')}</div>`;
  }
  const body = openModal(`${item ? 'Edit' : 'Tambah'} ${sc.label}`, `
    <form id="rowform">
      ${sc.fields.map((fl) => {
        const v = d[fl.k] ?? '';
        if (fl.type === 'brand') return `<label>${esc(fl.l)}</label><select name="${fl.k}"><option value="">— Umum (semua brand) —</option>${BRANDS.map((b) => `<option value="${esc(b.id)}" ${b.id === v ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>`;
        if (fl.type === 'fabric') return `<label>${esc(fl.l)}</label><select name="${fl.k}"><option value="">— tidak pakai Stok Kain —</option>${FABRICS.map((x) => `<option value="${esc(x.id)}" ${x.id === v ? 'selected' : ''}>${esc(x.data.name)} (${rp(x.data.pricePerMeter)}/m)</option>`).join('')}</select>`;
        if (fl.type === 'checkbox') return `<label class="inline"><input type="checkbox" name="${fl.k}" ${v ? 'checked' : ''}/> ${esc(fl.l)}</label>`;
        if (fl.type === 'select') return `<label>${esc(fl.l)}</label><select name="${fl.k}">${fl.opts.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        if (fl.type === 'textarea') return `<label>${esc(fl.l)}</label><textarea name="${fl.k}" rows="2">${esc(v)}</textarea>`;
        return `<label>${esc(fl.l)}${fl.req ? ' *' : ''}</label><input name="${fl.k}" type="${fl.type}" ${fl.type === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${fl.req ? 'required' : ''}/>`;
      }).join('')}
      ${extra}
      <div class="actions"><button type="button" class="ghost" id="cancel">Batal</button><button class="primary">Simpan</button></div>
    </form>`);
  body.querySelector('#cancel').onclick = closeModal;
  body.querySelector('#rowform').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {};
    sc.fields.forEach((fl) => {
      const el = form.elements[fl.k];
      if (!el) return;
      if (fl.type === 'checkbox') data[fl.k] = el.checked;
      else if (fl.type === 'number') data[fl.k] = Number(el.value) || 0;
      else data[fl.k] = el.value.trim();
    });
    if (coll === 'product_models') {
      const biaya = {};
      BIAYA_KEYS.forEach((k) => { const v = form.elements['bio_' + k].value; if (v !== '') biaya[k] = Number(v) || 0; });
      data.biaya = biaya;
    }
    try {
      if (item) await api('PATCH', `/api/c/${coll}/${item.id}`, { version: item.version, data });
      else await api('POST', `/api/c/${coll}`, { data });
      closeModal();
      toast('Data tersimpan.');
      route();
    } catch (err) {
      if (err.status === 409 && err.data && err.data.current) { closeModal(); toast('Data ini baru diubah orang lain. Daftar dimuat ulang.', 'err'); route(); }
      else toast(err.message, 'err');
    }
  };
}

function confirmDelete(coll, item) {
  const sc = S[coll];
  const name = item && (item.data.name || item.data.title || item.data.model || item.data.personName || item.data.empName || item.data.customer || item.data.host || item.data.orderNo || item.data.item || item.data.nama || item.data.nomor || '');
  const body = openModal('Hapus data?', `
    <p>Data ${name ? `<b>${esc(name)}</b> ` : ''}dari <b>${esc(sc.label)}</b> akan disembunyikan.</p>
    <p class="muted">Data tidak hilang permanen. Owner masih bisa memulihkannya dengan mencentang "Tampilkan yang terhapus".</p>
    <div class="actions"><button class="ghost" id="no">Batal</button><button class="danger" id="yes">Ya, hapus</button></div>`);
  body.querySelector('#no').onclick = closeModal;
  body.querySelector('#yes').onclick = async () => {
    try { await api('DELETE', `/api/c/${coll}/${item.id}`, { confirm: true }); closeModal(); toast('Data dihapus (bisa dipulihkan).'); route(); }
    catch (err) { toast(err.message, 'err'); }
  };
}

async function restoreRow(coll, id) {
  try { await api('POST', `/api/c/${coll}/${id}/restore`, {}); toast('Data dipulihkan.'); route(); }
  catch (err) { toast(err.message, 'err'); }
}

// PERKIRAAN HPP (model produk, HPP otomatis, tersinkron)

async function renderHpp() {
  const r = await api('GET', `/api/hpp/models${currentBrand !== 'all' ? '?brandId=' + encodeURIComponent(currentBrand) : ''}`);
  const std = r.biayaStandar;
  const stdSum = BIAYA_KEYS.reduce((s, k) => s + std[k], 0);
  $('#page').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="ok-box">Tersinkron otomatis: HPP dihitung dari harga kain di Stok Kain dan biaya standar di Pengaturan. Mengubah salah satunya langsung mengubah HPP semua model.</div>
      <div class="muted" style="margin-top:8px">Biaya lain standar per model: <b>${rp(stdSum)}</b> (jahit ${rp(std.jahit)}, iklan ${rp(std.iklan)}, packing ${rp(std.packing)}, dll.)
        ${isOwner() ? ' · <a href="#settings">Ubah biaya standar</a>' : ''}</div>
    </div>
    <div class="toolbar">
      <div class="grow"></div>
      <button class="ghost" id="hppCsv">Ekspor CSV (Excel)</button>
      <button class="ghost" id="hppPdf">Cetak / PDF</button>
      ${canMenu('hpp') ? '<button class="primary" id="hppAdd">+ Model</button>' : ''}
    </div>
    <div class="card overflow">
      ${r.items.length ? `<table>
        <tr><th>Model</th><th>Brand</th><th class="num">Kain (m)</th><th class="num">Harga kain/m</th><th class="num">Biaya lain</th><th class="num">HPP</th><th class="num">Harga tayang</th><th class="num">Margin</th><th class="num">Margin %</th><th class="noprint"></th></tr>
        ${r.items.map((m) => {
          const p = m.perhitungan;
          const biayaLain = p.hpp - p.kainTotal;
          return `<tr>
            <td><b>${esc(m.data.jenis || '')} ${esc(m.data.nomor || '')}</b>${m.data.namaModel ? `<div class="muted">${esc(m.data.namaModel)}</div>` : ''}</td>
            <td>${esc(brandName(m.data.brandId))}</td>
            <td class="num">${num(p.kainMeter)}</td>
            <td class="num">${rp(p.kainHarga)}</td>
            <td class="num">${rp(biayaLain)}</td>
            <td class="num"><b>${rp(p.hpp)}</b></td>
            <td class="num">${p.hargaTayang ? rp(p.hargaTayang) : '<span class="muted">belum diisi</span>'}</td>
            <td class="num">${p.margin !== null ? rp(p.margin) : '—'}</td>
            <td class="num">${p.pct !== null ? pill(p.pct + '%', p.pct >= 30 ? 'ok' : p.pct >= 15 ? 'warn' : 'off') : '—'}</td>
            <td class="noprint" style="text-align:right;white-space:nowrap">
              <button class="ghost small" data-hdetail="${esc(m.id)}">Rincian</button>
              ${canMenu('hpp') ? `<button class="ghost small" data-hedit="${esc(m.id)}">Edit</button> <button class="danger small" data-hdel="${esc(m.id)}">Hapus</button>` : ''}
            </td></tr>`;
        }).join('')}
      </table>` : '<div class="empty">Belum ada model. Tambah model baru, atau impor dari file HPP Anda.</div>'}
    </div>
    <div class="note">Kain (m) × harga kain/m = biaya kain. HPP = biaya kain + biaya lain. Margin = harga tayang − HPP. Biaya lain bisa dikhususkan per model lewat Edit.</div>`;

  const byId = (id) => r.items.find((x) => x.id === id);
  if ($('#hppAdd')) $('#hppAdd').onclick = () => openForm('product_models', S.product_models, null);
  document.querySelectorAll('[data-hedit]').forEach((b) => b.onclick = () => {
    const m = byId(b.dataset.hedit);
    openForm('product_models', S.product_models, { id: m.id, version: m.version, data: m.data });
  });
  document.querySelectorAll('[data-hdel]').forEach((b) => b.onclick = () => {
    const m = byId(b.dataset.hdel);
    confirmDelete('product_models', { id: m.id, data: { ...m.data, nomor: `${m.data.jenis} ${m.data.nomor}` } });
  });
  document.querySelectorAll('[data-hdetail]').forEach((b) => b.onclick = () => hppDetail(byId(b.dataset.hdetail)));
  $('#hppPdf').onclick = () => window.print();
  $('#hppCsv').onclick = () => {
    const head = ['Jenis', 'Nomor', 'Brand', 'Kain (m)', 'Harga kain/m', 'Biaya lain', 'HPP', 'Harga tayang', 'Margin', 'Margin %'];
    const lines = r.items.map((m) => {
      const p = m.perhitungan;
      return [m.data.jenis, m.data.nomor, brandName(m.data.brandId), p.kainMeter, p.kainHarga, p.hpp - p.kainTotal, p.hpp, p.hargaTayang, p.margin ?? '', p.pct ?? '']
        .map((v) => (typeof v === 'number' || v === '' ? v : `"${String(v).replace(/"/g, '""')}"`)).join(';');
    });
    download(new Blob(['\ufeff' + [head.join(';'), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `hpp_${today()}.csv`);
  };
}

function hppDetail(m) {
  const p = m.perhitungan;
  openModal(`Rincian HPP — ${m.data.jenis || ''} ${m.data.nomor || ''}`, `
    <table>
      <tr><th>Komponen</th><th class="num">Perhitungan</th><th class="num">Jumlah</th></tr>
      <tr><td>Kain</td><td class="num">${num(p.kainMeter)} m × ${rp(p.kainHarga)}</td><td class="num">${rp(p.kainTotal)}</td></tr>
      ${BIAYA_KEYS.map((k) => `<tr><td>${esc(BIAYA_LABEL[k])}</td><td class="num">1 × ${rp(p.biaya[k])}</td><td class="num">${rp(p.biaya[k])}</td></tr>`).join('')}
      <tr class="total"><td>Total HPP</td><td></td><td class="num">${rp(p.hpp)}</td></tr>
      <tr><td>Harga tayang</td><td></td><td class="num">${p.hargaTayang ? rp(p.hargaTayang) : 'belum diisi'}</td></tr>
      <tr><td>Margin</td><td></td><td class="num">${p.margin !== null ? rp(p.margin) + ' (' + p.pct + '%)' : '—'}</td></tr>
    </table>
    <div class="muted" style="margin-top:8px">Sumber harga kain: ${esc(p.sumberKain)}</div>
    <div class="actions"><button class="ghost" id="cl">Tutup</button></div>`).querySelector('#cl').onclick = closeModal;
}

// ============================================================================
// INVOICE (jahit & penjualan) + tampilan struk
// ============================================================================
async function renderInvoices() {
  const q = ownerShowDeleted && isOwner() ? '?deleted=1' : '';
  const { items } = await api('GET', '/api/c/invoices' + q);
  const rows = items.filter((i) => brandMatch(i.data.brandId));
  $('#view').innerHTML = `
    <div class="toolbar">
      <div class="grow"></div>
      ${isOwner() ? `<label class="inline" style="margin:0"><input type="checkbox" id="showDel" ${ownerShowDeleted ? 'checked' : ''}/> Tampilkan yang terhapus</label>` : ''}
      <button class="primary" id="invJ">+ Invoice Jahit</button>
      <button class="primary" id="invP">+ Invoice Penjualan</button>
    </div>
    <div class="card overflow">${rows.length ? `<table>
      <tr><th>No.</th><th>Tanggal</th><th>Jenis</th><th>Nama</th><th class="num">Total</th><th class="num">Dibayar</th><th class="num">Sisa</th><th>Status</th><th class="noprint"></th></tr>
      ${rows.map((it) => {
        const d = it.data;
        const sisa = d.sisa ?? (d.status === 'Lunas' ? 0 : Number(d.total) || 0);
        const st = d.status === 'Lunas' || (d.sisa === 0) ? 'Lunas' : (d.status || (sisa > 0 ? 'Belum Lunas' : 'Lunas'));
        return `<tr class="${it.deletedAt ? 'deleted' : ''}">
          <td>${esc(d.no || '—')}</td><td>${esc(d.date || '')}</td>
          <td>${d.type === 'penjualan' ? 'Penjualan' : 'Jahit'}</td>
          <td>${esc(d.tailor || d.customer || '')}</td>
          <td class="num">${rp(d.total)}</td><td class="num">${rp(d.dibayar)}</td><td class="num">${rp(sisa)}</td>
          <td>${pill(st, st === 'Lunas' ? 'ok' : st === 'Sebagian' ? 'warn' : 'off')}</td>
          <td class="noprint" style="text-align:right;white-space:nowrap">
            ${it.deletedAt ? (isOwner() ? `<button class="ghost small" data-irest="${esc(it.id)}">Pulihkan</button>` : '')
              : `<button class="ghost small" data-iview="${esc(it.id)}">Lihat / Cetak</button> <button class="ghost small" data-iedit="${esc(it.id)}">Edit</button> <button class="danger small" data-idel="${esc(it.id)}">Hapus</button>`}
          </td></tr>`;
      }).join('')}
    </table>` : '<div class="empty">Belum ada invoice.</div>'}</div>`;

  $('#invJ').onclick = () => openInvoiceForm(null, 'jahit');
  $('#invP').onclick = () => openInvoiceForm(null, 'penjualan');
  if ($('#showDel')) $('#showDel').onchange = (e) => { ownerShowDeleted = e.target.checked; route(); };
  const find = (id) => rows.find((x) => x.id === id);
  document.querySelectorAll('[data-iview]').forEach((b) => b.onclick = () => openReceipt(find(b.dataset.iview)));
  document.querySelectorAll('[data-iedit]').forEach((b) => b.onclick = () => openInvoiceForm(find(b.dataset.iedit), null));
  document.querySelectorAll('[data-idel]').forEach((b) => b.onclick = () => confirmDelete('invoices', find(b.dataset.idel)));
  document.querySelectorAll('[data-irest]').forEach((b) => b.onclick = () => restoreRow('invoices', b.dataset.irest));
}

function invRowHtml(it, jenis) {
  return `<tr class="irow">
    <td><input class="ri" name="model" value="${esc(it.model || '')}" placeholder="Model"/></td>
    <td><input class="ri" name="color" value="${esc(it.color || '')}" placeholder="Warna"/></td>
    <td><input class="ri" name="size" value="${esc(it.size || '')}" placeholder="Ukuran" style="width:80px"/></td>
    <td><input class="ri" name="qty" type="number" step="any" min="0" value="${esc(it.qty ?? '')}" style="width:90px"/></td>
    <td><input class="ri" name="price" type="number" step="any" min="0" value="${esc(it.price ?? '')}" style="width:120px"/></td>
    <td class="num amt">${rp((Number(it.qty) || 0) * (Number(it.price) || 0))}</td>
    <td><button type="button" class="ghost small rdel">✕</button></td>
  </tr>`;
}

async function openInvoiceForm(item, jenisBaru) {
  const st = (await api('GET', '/api/settings')).settings;
  const d = item ? item.data : {};
  const jenis = item ? (d.type === 'penjualan' ? 'penjualan' : 'jahit') : jenisBaru;
  const defaultPrice = jenis === 'jahit' ? st.biayaStandar.jahit : '';
  const rowsData = d.items && d.items.length ? d.items : [{ qty: '', price: defaultPrice }];
  const body = openModal(item ? `Edit invoice ${d.no || ''}` : (jenis === 'jahit' ? 'Invoice Jahit baru' : 'Invoice Penjualan baru'), `
    <form id="ivf">
      <div class="grid2">
        <div><label>Jenis</label><select name="type">
          <option value="jahit" ${jenis === 'jahit' ? 'selected' : ''}>Invoice Jahit (tukang jahit)</option>
          <option value="penjualan" ${jenis === 'penjualan' ? 'selected' : ''}>Invoice Penjualan (konveksi)</option></select></div>
        <div><label>Tanggal</label><input type="date" name="date" value="${esc(d.date || today())}" required/></div>
        <div><label>${jenis === 'jahit' ? 'Nama penjahit' : 'Nama pelanggan'} *</label><input name="nama" value="${esc(d.tailor || d.customer || '')}" required/></div>
        <div><label>Brand</label><select name="brandId"><option value="">— Umum —</option>${BRANDS.map((b) => `<option value="${esc(b.id)}" ${b.id === (d.brandId || (currentBrand !== 'all' ? currentBrand : '')) ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div><label>PPN / pajak (%)</label><input type="number" step="any" min="0" max="100" name="pajakPersen" value="${esc(d.pajakPersen ?? st.ppnPersen ?? 0)}"/></div>
        <div><label>Sudah dibayar (Rp)</label><input type="number" step="any" min="0" name="dibayar" value="${esc(d.dibayar ?? 0)}"/></div>
      </div>
      <div class="section-title" style="margin-top:14px">Rincian: jumlah pcs × harga satuan</div>
      <div class="overflow"><table id="itbl">
        <tr><th>Model</th><th>Warna</th><th>Ukuran</th><th>Jumlah pcs</th><th>Harga satuan</th><th class="num">Jumlah</th><th></th></tr>
        ${rowsData.map((it) => invRowHtml(it, jenis)).join('')}
      </table></div>
      <button type="button" class="ghost small" id="addRow" style="margin-top:8px">+ Tambah baris</button>
      <div style="text-align:right;margin-top:12px;line-height:1.7">
        <div>Subtotal: <b id="subt">${rp(0)}</b></div>
        <div>Pajak: <b id="pjk">${rp(0)}</b></div>
        <div style="font-size:16px">Total: <b id="tot">${rp(0)}</b></div>
      </div>
      <label>Catatan</label><textarea name="note" rows="2">${esc(d.note || '')}</textarea>
      <div class="actions"><button type="button" class="ghost" id="cancel">Batal</button><button class="primary">Simpan</button></div>
    </form>`, true);

  const form = body.querySelector('#ivf');
  const recalc = () => {
    let subt = 0;
    form.querySelectorAll('#itbl tr.irow').forEach((tr) => {
      const q = Number(tr.querySelector('[name=qty]').value) || 0;
      const p = Number(tr.querySelector('[name=price]').value) || 0;
      tr.querySelector('.amt').textContent = rp(q * p);
      subt += q * p;
    });
    const pct = Number(form.pajakPersen.value) || 0;
    const pjk = Math.round(subt * pct / 100);
    body.querySelector('#subt').textContent = rp(subt);
    body.querySelector('#pjk').textContent = rp(pjk);
    body.querySelector('#tot').textContent = rp(subt + pjk);
  };
  const bindRow = (tr) => tr.querySelector('.rdel').onclick = () => { tr.remove(); recalc(); };
  form.querySelectorAll('#itbl tr.irow').forEach(bindRow);
  form.addEventListener('input', recalc);
  form.querySelector('[name=type]').onchange = (e) => {
    if (e.target.value === 'jahit') form.querySelectorAll('#itbl [name=price]').forEach((i) => { if (!i.value) i.value = st.biayaStandar.jahit; });
    recalc();
  };
  body.querySelector('#addRow').onclick = () => {
    const tbl = body.querySelector('#itbl');
    const tmp = document.createElement('tbody');
    tmp.innerHTML = invRowHtml({ qty: '', price: form.type.value === 'jahit' ? st.biayaStandar.jahit : '' });
    const tr = tmp.firstElementChild;
    tbl.appendChild(tr);
    bindRow(tr);
    recalc();
  };
  body.querySelector('#cancel').onclick = closeModal;
  recalc();

  form.onsubmit = async (e) => {
    e.preventDefault();
    const items = [];
    form.querySelectorAll('#itbl tr.irow').forEach((tr) => {
      const g = (n) => tr.querySelector(`[name=${n}]`).value.trim();
      if (g('model') || Number(g('qty'))) items.push({ model: g('model'), color: g('color'), size: g('size'), qty: Number(g('qty')) || 0, price: Number(g('price')) || 0 });
    });
    if (!items.length) return toast('Isi minimal satu baris rincian.', 'err');
    const type = form.type.value;
    const data = {
      type, date: form.date.value, brandId: form.brandId.value,
      pajakPersen: Number(form.pajakPersen.value) || 0, dibayar: Number(form.dibayar.value) || 0,
      note: form.note.value.trim(), items
    };
    if (type === 'jahit') data.tailor = form.nama.value.trim(); else data.customer = form.nama.value.trim();
    try {
      if (item) await api('PATCH', `/api/c/invoices/${item.id}`, { version: item.version, data });
      else await api('POST', '/api/c/invoices', { data });
      closeModal(); toast('Invoice tersimpan.'); route();
    } catch (err) {
      if (err.status === 409 && err.data && err.data.current) { closeModal(); toast('Invoice ini baru diubah orang lain. Daftar dimuat ulang.', 'err'); route(); }
      else toast(err.message, 'err');
    }
  };
}

const CODE128 = ["11011001100", "11001101100", "11001100110", "10010011000", "10010001100", "10001001100", "10011001000", "10011000100", "10001100100", "11001001000", "11001000100", "11000100100", "10110011100", "10011011100", "10011001110", "10111001100", "10011101100", "10011100110", "11001110010", "11001011100", "11001001110", "11011100100", "11001110100", "11101101110", "11101001100", "11100101100", "11100100110", "11101100100", "11100110100", "11100110010", "11011011000", "11011000110", "11000110110", "10100011000", "10001011000", "10001000110", "10110001000", "10001101000", "10001100010", "11010001000", "11000101000", "11000100010", "10110111000", "10110001110", "10001101110", "10111011000", "10111000110", "10001110110", "11101110110", "11010001110", "11000101110", "11011101000", "11011100010", "11011101110", "11101011000", "11101000110", "11100010110", "11101101000", "11101100010", "11100011010", "11101111010", "11001000010", "11110001010", "10100110000", "10100001100", "10010110000", "10010000110", "10000101100", "10000100110", "10110010000", "10110000100", "10011010000", "10011000010", "10000110100", "10000110010", "11000010010", "11001010000", "11110111010", "11000010100", "10001111010", "10100111100", "10010111100", "10010011110", "10111100100", "10011110100", "10011110010", "11110100100", "11110010100", "11110010010", "11011011110", "11011110110", "11110110110", "10101111000", "10100011110", "10001011110", "10111101000", "10111100010", "11110101000", "11110100010", "10111011110", "10111101110", "11101011110", "11110101110", "11010000100", "11010010000", "11010011100"];
function code128Svg(text) {
  const vals = [...String(text)].map((ch) => ch.charCodeAt(0) - 32).filter((v) => v >= 0 && v <= 95);
  let sum = 104;
  vals.forEach((v, i) => { sum += (i + 1) * v; });
  const seq = [104, ...vals, sum % 103];
  const bits = seq.map((v) => CODE128[v]).join('') + '1100011101011';
  const w = 2, h = 56, quiet = 12;
  let x = quiet, rects = '';
  for (const ch of bits) { if (ch === '1') rects += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += w; }
  const W = x + quiet;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" style="max-width:100%"><g fill="#111">${rects}</g></svg>`;
}

async function renderAset() {
  const r = await api('GET', `/api/reports/neraca?asOf=9999-12-31${brandQS()}`);
  const { items } = await api('GET', '/api/c/assets' + (ownerShowDeleted && isOwner() ? '?deleted=1' : ''));

  const detail = Object.fromEntries(r.aset.detailAset.map((x) => [x.id, x]));
  const totalHarga = rows.reduce((s, i) => s + (Number(i.data.harga) || 0), 0);
  const totalBuku = rows.reduce((s, i) => s + (detail[i.id] ? detail[i.id].nilaiBuku : 0), 0);
  $('#view').innerHTML = `
    <div class="toolbar">
      <div class="grow"></div>
      ${isOwner() ? `<label class="inline" style="margin:0"><input type="checkbox" id="showDel" ${ownerShowDeleted ? 'checked' : ''}/> Tampilkan yang terhapus</label>` : ''}

    <div class="card overflow">${rows.length ? `<table>

      ${rows.map((it) => {
        const d = it.data;
        const life = Number(d.umurBulan) || 0;
        const perBulan = life ? ((Number(d.harga) || 0) - (Number(d.nilaiSisa) || 0)) / life : 0;
        const x = detail[it.id] || { akumulasi: 0, nilaiBuku: Number(d.harga) || 0 };
        return `<tr class="${it.deletedAt ? 'deleted' : ''}">
          <td><b>${esc(d.nama)}</b></td><td>${esc(d.kategori || '')}</td><td>${esc(d.tanggal || '')}</td>
          <td class="num">${rp(d.harga)}</td><td class="num">${rp(perBulan)}</td><td class="num">${rp(x.akumulasi)}</td>
          <td class="num"><b>${rp(x.nilaiBuku)}</b></td><td>${life} bln</td>
          <td class="noprint" style="text-align:right;white-space:nowrap">${it.deletedAt ? (isOwner() ? `<button class="ghost small" data-arest="${esc(it.id)}">Pulihkan</button>` : '') :
            `<button class="ghost small" data-aedit="${esc(it.id)}">Edit</button> <button class="danger small" data-adel="${esc(it.id)}">Hapus</button>`}</td>
        </tr>`;
      }).join('')}
      <tr class="total"><td colspan="3">Total</td><td class="num">${rp(totalHarga)}</td><td></td><td></td><td class="num">${rp(totalBuku)}</td><td></td><td></td></tr>
    </table>` : '<div class="empty">Belum ada aset. Tambahkan mesin jahit, obras, setrika, kendaraan, dan peralatan lain.</div>'}</div>
    <div class="note">Penyusutan garis lurus: (harga − nilai sisa) ÷ umur bulan. Aset yang sudah habis umurnya tidak disusutkan lagi. Total nilai buku dipakai di Neraca.</div>`;
  $('#addA').onclick = () => openForm('assets', S.assets, null);
  if ($('#showDel')) $('#showDel').onchange = (e) => { ownerShowDeleted = e.target.checked; route(); };
  const find = (id) => rows.find((x) => x.id === id);
  document.querySelectorAll('[data-aedit]').forEach((b) => b.onclick = () => openForm('assets', S.assets, find(b.dataset.aedit)));
  document.querySelectorAll('[data-adel]').forEach((b) => b.onclick = () => confirmDelete('assets', find(b.dataset.adel)));
  document.querySelectorAll('[data-arest]').forEach((b) => b.onclick = () => restoreRow('assets', b.dataset.arest));
}

      <div>${permChecks(u ? u.permissions : [])}</div>

}

          <label>Telepon</label><input name="teleponUsaha" value="${esc(st.teleponUsaha || '')}" ${ro} />
          <div class="section-title" style="margin-top:14px">Keuangan</div>
          <label>Modal awal usaha (Rp)</label><input type="number" name="modalAwal" min="0" value="${esc(st.modalAwal ?? 0)}" ${ro} />
          <label>PPN / pajak default invoice (%)</label><input type="number" name="ppnPersen" min="0" max="100" step="any" value="${esc(st.ppnPersen ?? 0)}" ${ro} />
          <label>Batas stok menipis (pcs)</label><input type="number" name="lowStockThreshold" min="0" value="${esc(st.lowStockThreshold ?? 10)}" ${ro} />
          <div class="section-title" style="margin-top:14px">Biaya standar per pcs / model (dipakai Perkiraan HPP)</div>
          <div class="grid2">${BIAYA_KEYS.map((k) => `<div><label>${esc(BIAYA_LABEL[k])}</label><input type="number" step="any" min="0" name="bs_${k}" value="${esc(bs[k])}" ${ro} /></div>`).join('')}</div>
          ${isOwner() ? '<div class="actions"><button class="primary">Simpan pengaturan</button></div>' : '<div class="muted" style="margin-top:8px">Hanya Owner yang bisa mengubah pengaturan usaha.</div>'}
        </form>
      </div>
      <div class="card">
        <div class="section-title">Ganti password Anda</div>
        <form id="pwf">
          <label>Password lama</label><input name="cur" type="password" required />
          <label>Password baru (min. 8 karakter)</label><input name="nw" type="password" minlength="8" required />
          <div class="actions"><button class="primary">Ganti password</button></div>
        </form>
        <div class="section-title" style="margin-top:20px">Backup data</div>
        <p class="muted">Unduh semua data yang bisa Anda akses sebagai file JSON.</p>
        <button class="ghost" id="bk">Unduh backup JSON</button>
      </div>
    </div>`;

  if (isOwner()) $('#sf').onsubmit = async (e) => {
    e.preventDefault();
    const g = e.target;
    const biayaStandar = Object.fromEntries(BIAYA_KEYS.map((k) => [k, Number(g['bs_' + k].value) || 0]));
    try {
      await api('PUT', '/api/settings', {
        companyName: g.companyName.value, alamatUsaha: g.alamatUsaha.value, npwp: g.npwp.value,
        websiteUsaha: g.websiteUsaha.value, teleponUsaha: g.teleponUsaha.value,
        modalAwal: g.modalAwal.value, ppnPersen: g.ppnPersen.value, lowStockThreshold: g.lowStockThreshold.value, biayaStandar
      });
      toast('Pengaturan disimpan. HPP dan laporan ikut diperbarui.');
    } catch (err) { toast(err.message, 'err'); }
  };

  $('#pwf').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('POST', '/api/auth/password', { currentPassword: e.target.cur.value, newPassword: e.target.nw.value });
      toast('Password diubah. Silakan login ulang.');
      showLogin();
    } catch (err) { toast(err.message, 'err'); }
  };

  $('#bk').onclick = async () => {
    const out = {};
    const colls = Object.keys(S).filter((c) => canMenu(COLL_MENU[c]));
    for (const c of colls) out[c] = (await api('GET', `/api/c/${c}?deleted=1`).catch(() => ({ items: [] }))).items;
    download(new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), data: out }, null, 2)], { type: 'application/json' }), `backup_konveksipro_${today()}.json`);
  };
}

function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

// ============================================================================
// DASHBOARD DAN START
// ============================================================================
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

(async function init() {
  try {
    const r = await api('GET', '/api/auth/me', undefined, true);
    ME = r.user;
    localStorage.setItem('kp_me', JSON.stringify(ME));
    await startApp();
  } catch (e) {
    const cached = localStorage.getItem('kp_me');
    if (e.offline && cached) { ME = JSON.parse(cached); OFFLINE = true; await startApp(); }
    else showLogin();
  }
})();
</script>
</body>
</html>
